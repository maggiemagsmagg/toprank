<style>
    /* ===== ESTILO GERAL ===== */
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: radial-gradient(circle at top left, #0f0f0f, #1a1a1a 80%);
        color: #fff;
        margin: 0;
        padding: 30px;
    }

    h1 {
        color: #1DB954;
        text-align: center;
        margin-bottom: 15px;
        letter-spacing: 1px;
        text-shadow: 0 0 6px rgba(29, 185, 84, 0.4);
    }

    h2 {
        color: #ffffff;
        border-bottom: 1px solid #ffffff;
        padding-bottom: 4px;
        margin-top: 25px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
        background-color: #181818;
    }

    th, td {
        padding: 14px 12px;
        text-align: left;
        transition: background 0.25s ease;
    }

    th {
        background-color: #222;
        color: #b3b3b3;
        text-transform: uppercase;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
    }

    td {
        border-top: 1px solid #2a2a2a;
    }

    tr:nth-child(even) {
        background-color: #1d1d1d;
    }

    tr:hover {
        background-color: #282828;
        transform: scale(1.01);
    }

    .col-numero {
        text-align: right;
        font-family: 'Courier New', monospace;
        color: #b3b3b3;
    }

    .col-titulo {
        font-weight: bold;
        color: #fff;
        cursor: pointer;
        transition: color 0.3s ease;
    }

    .col-titulo:hover {
        color: #1DB954;
    }

    .back-button {
        background: linear-gradient(90deg, #1DB954, #17a446);
        border: none;
        color: #fff;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.3s;
        box-shadow: 0 0 10px rgba(29, 185, 84, 0.4);
    }

    .back-button:hover {
        opacity: 0.9;
        transform: translateY(-1px);
    }

    #artistDetails, #songsTable {
        display: none;
        margin-top: 30px;
        animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    table th:first-child, table td:first-child {
        width: 80px;
        text-align: center;
    }

    footer {
        text-align: center;
        color: #777;
        margin-top: 50px;
        font-size: 0.9rem;
    }

    #searchInput {
    width: 97%;
    padding: 10px 15px;
    margin-top: 10px;
    border: none;
    border-radius: 30px;
    background-color: #1a1a1a;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: all 0.3s ease;
    box-shadow: 0 0 0 1px #333 inset;
}

#searchInput::placeholder {
    color: #888;
}

#searchInput:focus {
    box-shadow: 0 0 0 2px #1DB954 inset;
    background-color: #111;
}

/* ===== FUNDO COM BLUR ===== */
.popup {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  backdrop-filter: blur(18px);
  background: rgba(0, 0, 0, 0.60);
  justify-content: center;
  align-items: center;
  animation: fadeIn .25s ease;
}

/* ===== CARD DO POPUP ===== */
.popup__card {
  background: linear-gradient(180deg, #1b1b1b 0%, #111 100%);
  color: #fff;
  width: min(460px, 92%);
  border-radius: 22px;
  padding: 30px 26px;
  position: relative;
  box-shadow: 0 20px 45px rgba(0,0,0,.7);
  animation: slideUp .35s ease;
}

/* ===== BOTÃO DE FECHAR ===== */
.popup__close {
  position: absolute;
  top: 18px;
  right: 26px;
  font-size: 48px;
  background: rgba(255, 255, 255, 0.08);
  padding: 0px 16px;
  border-radius: 16px;
  border: none;
  cursor: pointer;
  color: #eee;
  transition: .2s;
}
.popup__close:hover {
  background: rgba(255,255,255,0.20);
}

/* ===== FOTO DO ARTISTA ===== */
.popup__img {
  width: 260px;
  height: 260px;
  border-radius: 14px;
  object-fit: cover;
  margin: auto;
  display: block;
  border: 4px solid rgba(255,255,255,.25);
  box-shadow: 0 8px 25px rgba(0,0,0,.5);
}

/* ===== RANKING ===== */
.popup__rank {
  position: absolute;
  top: 22px;
  left: 22px;
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0b88ff, #0060d0);
  box-shadow: 0 0 15px rgba(0,119,255,.4);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 1.2rem;
}

/* ===== NOME ===== */
.popup__name {
  margin: 18px 0 10px;
  text-align: center;
  color: #fff;
  font-size: 1.9rem;
  font-weight: 700;
}

/* ===== ESTATÍSTICAS ===== */
.popup__stats {
  display: flex;
  justify-content: space-around;
  margin-top: 18px;
  padding: 10px 0;
}
.popup__stats div {
  text-align: center;
}
.popup__stats b {
  font-size: 20px;
  color: #ffffff;
}
.popup__stats span {
  font-size: .9rem;
  color: rgb(255, 255, 255);
}

/* ===== LISTA DE CIDADES ===== */
.popup__cities {
  margin-top: 25px;
  background: #0d0d0d;
  padding: 18px 20px;
  border-radius: 12px;
  max-height: 240px;
  overflow-y: auto;
  border: 1px solid #1b1b1b;
  box-shadow: inset 0 0 8px rgba(0,0,0,.4);
}

.city-item {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #1f1f1f;
}
.city-item:last-child {
  border-bottom: none;
}
.city-item span {
  color: #bbb;
}

/* ===== ANIMAÇÕES ===== */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}




</style>

function renderArtists() {
    const tbody = document.getElementById("artistsBody");
    tbody.innerHTML = "";

    const sorted = [...artistsData].sort((a, b) => b.ouvintes - a.ouvintes);

    sorted.forEach((artist, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${index + 1}</td>
            <td class="col-titulo" onclick="openSongs('${artist.name}')">${artist.name}</td>
            <td class="col-numero">${artist.ouvintes.toLocaleString('pt-BR')}</td>
            <td class="col-numero">${artist.daily.toLocaleString('pt-BR')}</td>

        `;
        tbody.appendChild(row);
    });
}

function searchArtist() {
    const input = document.getElementById("searchInput");
    const filter = input.value.toLowerCase();
    const table = document.getElementById("artistsTable");
    const tr = table.getElementsByTagName("tr");

    for (let i = 1; i < tr.length; i++) {
        const td = tr[i].getElementsByTagName("td")[1];
        if (td) {
            const txtValue = td.textContent || td.innerText;
            tr[i].style.display = txtValue.toLowerCase().includes(filter) ? "" : "none";
        }
    }
}


function openSongs(artistName) {
    const songs = songsData[artistName];
    if (!songs) return;

    document.getElementById("artistsTable").style.display = "none";
    const songsDiv = document.getElementById("songsTable");
    songsDiv.style.display = "block";
    document.getElementById("artistDetails").style.display = "none";

    const sortedSongs = [...songs].sort((a, b) => b.total - a.total);

    let html = `
        <button class="back-button" onclick="goBackToArtists()">← Back</button>
        <h2 id="songsTitle" class="col-titulo" style="cursor:pointer" onclick="openArtistPopup('${artistName}')">${artistName} - Top Songs</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Song Title</th>
                    <th>Streams</th>
                    <th>Daily</th>
                </tr>
            </thead>
            <tbody>
    `;

    sortedSongs.forEach((song, index) => {
        html += `
            <tr onclick="openArtist('${song.title}')">
                <td>${index + 1}</td>
                <td class="col-titulo">${song.title}</td>
                <td class="col-numero">${song.total.toLocaleString()}</td>
                <td class="col-numero">${song.daily.toLocaleString()}</td>
            </tr>
        `;
    });

    html += "</tbody></table>";
    songsDiv.innerHTML = html;
}

function goBackToArtists() {
    document.getElementById("artistsTable").style.display = "table";
    document.getElementById("songsTable").style.display = "none";
    document.getElementById("artistDetails").style.display = "none";
}

function openArtistPopup(artistName){
  const data = popupData[artistName];

  document.getElementById("ap_rank").textContent = data.rank;
  document.getElementById("ap_img").src = data.image;
  document.getElementById("ap_name").textContent = artistName;
  document.getElementById("ap_followers").textContent = data.followers;
  document.getElementById("ap_listeners").textContent = data.listeners;

  const citiesHTML = data.cities.map(c => `
    <div class="city-item">
      <strong>${c.name}</strong>
      <span>${c.listeners.toLocaleString('pt-BR')} listeners</span>
    </div>
  `).join("");
  document.getElementById("ap_cities").innerHTML = citiesHTML;

  document.getElementById("artistPopup").style.display = "flex";
}

}

// Define a imagem do popup aceitando URL normal, Data URI completo,
// ou somente o payload Base64 (com/sem quebras de linha).
function setArtistImage(imgEl, src, mime = "image/gif") {
  if (!src) return;

  // Caso já seja uma data URI completa
  if (src.startsWith("data:")) {
    imgEl.src = src;
    return;
  }

  // Se veio só o payload base64 (com possíveis quebras)
  const onlyB64 = src.replace(/^data:[^,]+,/, "").replace(/\s/g, "");
  // Monta a data URI correta
  imgEl.src = `data:${mime};base64,${onlyB64}`;
}
